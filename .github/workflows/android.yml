name: Android CI

on:
  push:
    branches: [ main ] # Añadida tu rama para que se dispare con tus commits actuales
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint Android
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # =========================================================================
      # SCRIPT DE AUDITORÍA AVANZADO: Escanea símbolos exportados y cadenas JNI
      # =========================================================================
      - name: Extraer y listar símbolos JNI reales del binario
        run: |
          echo "=== LISTANDO SÍMBOLOS JNI DE LA CLASE CONFIG ==="
          mkdir -p temp_jnidump
          unzip -q app/libs/ffmpeg-kit-16kb-full.aar -d temp_jnidump
          
          echo "--- 1. SÍMBOLOS EXPORTADOS (KOTLIN -> C++) ---"
          find temp_jnidump -name "libffmpegkit.so" -path "*arm64-v8a*" -exec nm -D {} \; | grep "FFmpegKitConfig" || true
          
          echo "--- 2. CADENAS DE INTROSPECCIÓN JNI DE ARTHENICA (C++ -> KOTLIN) ---"
          find temp_jnidump -name "libffmpegkit.so" -path "*arm64-v8a*" -exec strings {} \; | grep -E '^\(.*\)[VIJFDZ\[]|^safOpen|^safClose|^statistics|^log' | sort -u || true
          
          rm -rf temp_jnidump

      - name: Build
        run: ./gradlew app:assemble

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: METROX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
